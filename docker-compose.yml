services:
  app:
    build:
      context: .
    image: solar-tracking-app:local
    container_name: solar_tracking_app
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - backup_data:/app/backups
    ports:
      - "3000:3000"
    environment:
      TZ: ${USE_TZ:-Europe/Rome}
      USE_LOCALE: ${USE_LOCALE:-en-US}
    env_file:
      - path: .env.docker
        required: false
      - path: .env
        required: false
    # depends_on:
    #   mysql:
    #     condition: service_healthy

  worker:
    build:
      context: .
    image: solar-tracking-app:local
    container_name: solar_tracking_worker
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      TZ: ${USE_TZ:-Europe/Rome}
      USE_LOCALE: ${USE_LOCALE:-en-US}
    env_file:
      - path: .env.docker
        required: false
      - path: .env
        required: false
    command: pnpm sync:worker
    # depends_on:
    #   mysql:
    #     condition: service_healthy

  # mysql:
  #   image: mysql:8.0
  #   container_name: solar_tracking_db
  #   ports:
  #     # - "127.0.0.1:3306:3306"
  #     - "3306:3306"
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pwd}
  #     MYSQL_DATABASE: ${MYSQL_DATABASE:-solar_tracking}
  #     MYSQL_USER: ${MYSQL_USER:-solartracking}
  #     MYSQL_PASSWORD: ${MYSQL_PASSWORD:-solartracking_pwd}
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #     - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  #     - ./docker/mysql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  backup:
    build:
      context: .
    image: solar-tracking-app:local
    container_name: solar_tracking_backup
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - backup_data:/app/backups
    env_file:
      - path: .env.docker
        required: false
      - path: .env
        required: false
    environment:
      TZ: ${USE_TZ:-Europe/Rome}
      USE_LOCALE: ${USE_LOCALE:-en-US}
    command: sh scripts/backup-loop.sh
    depends_on:
      mysql:
        condition: service_healthy
    profiles: ["backup"]

volumes:
  mysql_data:
    name: solar_tracking-mysql
  backup_data:
    name: solar_tracking-backup
